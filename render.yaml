services:
  - type: web
    name: kazi-proof
    runtime: node
    plan: free
    buildCommand: cd server && npm ci --include=dev && npm run build && cd ../web && npm ci --include=dev && npm run build
    startCommand: cd server && npx prisma migrate deploy && node dist/seed.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kazi-proof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: AI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REQUIRE_CLOUD_PHOTOS
        value: "true"
      - key: WEB_URL
        sync: false
      - key: PAYOUT_RECEIVER_EMAIL
        value: sb-u6myd53695892@personal.example.com

databases:
  - name: kazi-proof-db
    plan: free
    databaseName: kazi_proof
    user: kazi
